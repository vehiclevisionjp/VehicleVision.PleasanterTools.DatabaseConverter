name: 不具合
description: 再現手順と環境を記録する
body:
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: このツール / Pleasanter / OS の版。資格情報は書かないでください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順と期待する動作
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 実際の出力
      description: 接続文字列、パスワード、実運用データを除いてください。

# 参照用サブモジュール `_reference/Implem.Pleasanter` が、上流の main の先頭より
# 遅れていないかを日次で検出し、遅れていれば Issue と Draft PR を出す。
# 開いている PR があれば、同じ PR へコミットを足して、ポインタを最新へ進める。
#
# ■ 何のためか
#   このサブモジュールは API 仕様・スキーマ・挙動の**事実確認のための参照専用**
#   （`_reference/README.md`）。**古いままだと、確認結果が現行の Pleasanter と
#   食い違う。** 手作業に任せていた結果、気付いたときには 3 リリース分
#   遅れていた（Questionnaire #181）ので、遅れに気付く仕掛けを置く。
#
# ■ **追従先は、上流の main の先頭**
#   以前はリリースタグへ固定していたが、2026-10-19 に方針を変えた
#   （リリース前の変更にも早く気付くため。`_reference/README.md`）。
#   **main はリリース前の変更を含む。** 「どの版か」は、コミット SHA と <Version> で言う。
#
# ■ **Dependabot には置き換えていない**
#   `package-ecosystem: gitsubmodule` は追跡ブランチの最新コミットを追うので、main 追従なら
#   合う見込みはある。ただし、**2026-02 にタグの扱いが変わったばかり**（semver 形式のタグを
#   優先する。dependabot/dependabot-core#1639）で、追従するブランチの決め方と、未マージの
#   PR の更新の仕方が公式ドキュメントに書かれておらず、**動作を手元で確かめられない**
#   （2026-10-19 参照）。確かめられる自作の仕組みを残している。
#   **置き換えるなら、Dependabot の PR の挙動を実機で確かめてから。**
#
# ■ **判定と文面はスクリプト側に置く**
#   `run: |` の中は行頭が字下げされるため、閉じの `EOF` が行頭に来ず、
#   ヒアドキュメントが終端しない。Issue / PR の本文を扱う処理は
#   `scripts/reference-submodule-*.sh` へ寄せてある。手元でも同じものを流せる。
#
# ■ **PR は GitHub App のトークンで作る**（`my-repo-automation-bot`）
#   - `GITHUB_TOKEN` で作った PR・push は、ワークフローの連鎖を防ぐ仕様で他のワークフローを起こさず、
#     **必須チェックが付かないのでマージできない。** App のトークンなら通常の CI が起動する
#   - **リポジトリ設定「Actions に PR の作成と承認を許す」を有効にしなくても動く**
#     （`GitHub Actions is not permitted to create or approve pull requests` で失敗していた）
#   - **Issue の作成だけは `GITHUB_TOKEN`（`issues: write`）で行う。** App に Issues の権限を足さずに済む。
#     App へ要求するのは contents と pull-requests だけ（`release-run.yml` と同じ）
#   - 要るもの: 変数 `MY_REPO_AUTOMATION_BOT_CLIENT_ID`、シークレット `MY_REPO_AUTOMATION_BOT_PRIVATE_KEY`
#
# ⚠️ **scheduled workflow は既定ブランチ（develop）の内容でしか回らない。**
#    ここを直しても、develop へ入るまで日次の挙動は変わらない。
#    **実行時刻はずれることがある**（GitHub 側の混雑で遅れる。定刻の保証は無い）。
#
# ⚠️ **必須ステータスチェックにはしない。** 上流の更新でこちらの CI が赤くなる類の
#    仕掛けであり、他の PR のマージを塞いではいけない
#    （_documents/ブランチ運用方針.md「必須ステータスチェック」）。
#
# 参照した一次情報（いずれも 2026-09-11 参照）
#   - on.schedule（POSIX cron。UTC 固定で、既定ブランチでのみ実行）
#     https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#   - GITHUB_TOKEN の操作ではワークフローが起動しない
#     https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
#   - actions/checkout v7 は .github/workflows/ci.yml と同じ版に揃えた（勝手に上げない）
name: Reference Submodule Update

on:
  # 毎日 08:00 JST（前日 23:00 UTC）。**cron は UTC 固定**だが、
  # JST は夏時間が無いためこの対応は年間ずれない
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # **走っているものを止めない。** PR を作る途中で切ると、ブランチだけ残る
  cancel-in-progress: false

# **既定は読み取りだけ。** Issue の作成に要る権限は update ジョブ側で足す
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      latest_ref: ${{ steps.check.outputs.latest_ref }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      current_sha: ${{ steps.check.outputs.current_sha }}
    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          # **サブモジュールは取らない。** 索引の gitlink だけを書き換える
          submodules: false
          persist-credentials: false

      - name: 上流の main の先頭を調べる
        id: check
        run: bash ./scripts/reference-submodule-check.sh

      - name: 最新であることを記録して終わる
        if: steps.check.outputs.needs_update != 'true'
        env:
          CURRENT_TAG: ${{ steps.check.outputs.current_tag }}
          CURRENT_SHA: ${{ steps.check.outputs.current_sha }}
        run: |
          {
            echo "## 参照サブモジュールは最新です"
            echo
            echo "- 固定位置: \`${CURRENT_TAG:-（タグ無し）}\` (\`$CURRENT_SHA\`)"
          } >>"$GITHUB_STEP_SUMMARY"

  update:
    name: update
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Issue の作成だけに使う（GITHUB_TOKEN）。App には Issues の権限を要求しない
      contents: read
      issues: write
    steps:
      - name: App の設定を確認する
        env:
          HAS_CLIENT_ID: ${{ vars.MY_REPO_AUTOMATION_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.MY_REPO_AUTOMATION_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" != true ] || [ "$HAS_PRIVATE_KEY" != true ]; then
            echo '::error::MY_REPO_AUTOMATION_BOT_CLIENT_ID と MY_REPO_AUTOMATION_BOT_PRIVATE_KEY を登録してください。'
            exit 1
          fi
      - name: 短期の App トークンを発行する
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MY_REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MY_REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # ブランチの push に contents、PR の作成に pull-requests が要る。**それ以外は与えない**
          permission-contents: write
          permission-pull-requests: write

      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false
          # **App のトークンで取得する。** ここで入れたトークンが push にも使われ、
          # push から通常の CI が起動する
          token: ${{ steps.app-token.outputs.token }}

      - name: ポインタを進めて Issue と Draft PR を作る
        env:
          # ブランチの push と PR の作成は App のトークン
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Issue の作成だけは GITHUB_TOKEN（App に Issues の権限を足さないため）
          ISSUE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          LATEST_REF: ${{ needs.check.outputs.latest_ref }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          CURRENT_TAG: ${{ needs.check.outputs.current_tag }}
          CURRENT_SHA: ${{ needs.check.outputs.current_sha }}
        run: bash ./scripts/reference-submodule-open-pr.sh
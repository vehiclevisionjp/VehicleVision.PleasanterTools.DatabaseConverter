# npm と NuGet の patch 更新を検出して適用し、master（まだ無いリポジトリでは develop）へ PR を出して、CI が通れば自動でマージする。
#
# ■ なぜ Dependabot を使わないか
#   Dependabot の PR は、NOTICE の版・他のプロジェクトのロックファイルが追随せず、毎回人が直していた
#   （notice-consistency と dotnet restore --locked-mode が落ちる）。**検出と適用を自前のスクリプト
#   （scripts/apply-patch-updates.mjs）にして、NOTICE とロックファイルまで 1 つの PR にする。**
#
# ■ 流れ
#   1. 毎日、master を取得して、同じ major.minor の最新 patch を npm・NuGet から探す（minor・major は上げない）
#   2. 更新があれば、版・ロックファイル・NOTICE を直して、**App のトークンで** master への PR を作る
#   3. **PR に自動マージを設定する。** 必須チェックが全部通れば、GitHub が自動でマージする
#   4. マージされると、patch-updates-sync.yml が master → develop の同期 PR を作って、同じく自動マージする
#
# ■ なぜ App のトークンか
#   GITHUB_TOKEN で作った PR・push は、他のワークフローを起こさない（必須チェックが付かず、マージできない）。
#   App（my-repo-automation-bot）のトークンなら、通常どおり CI が動く。必要な権限は contents と pull-requests の書き込みだけ。
#   要るもの: 変数 MY_REPO_AUTOMATION_BOT_CLIENT_ID、シークレット MY_REPO_AUTOMATION_BOT_PRIVATE_KEY
#
# ■ 止まるとき
#   - 前回の patch 更新の PR が開いたままなら、新しい PR は作らない（PR を溜めない）
#   - NOTICE が自動では直せないときは、PR を作らずに失敗する（人が見る）
#   - CI が落ちたら、自動マージされずに PR が残る（人が見る）
name: Patch Updates

on:
  # 毎日 09:00 JST（前日 00:00 UTC）。**cron は UTC 固定**。実行時刻は GitHub の混雑でずれることがある
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  patch-updates:
    name: patch-updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: App の設定を確認する
        env:
          HAS_CLIENT_ID: ${{ vars.MY_REPO_AUTOMATION_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.MY_REPO_AUTOMATION_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" != true ] || [ "$HAS_PRIVATE_KEY" != true ]; then
            echo '::error::MY_REPO_AUTOMATION_BOT_CLIENT_ID と MY_REPO_AUTOMATION_BOT_PRIVATE_KEY を登録してください。'
            exit 1
          fi

      - name: 短期の App トークンを発行する
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MY_REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MY_REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # ブランチの push に contents、PR の作成と自動マージの設定に pull-requests。**それ以外は与えない**
          permission-contents: write
          permission-pull-requests: write

      - name: 土台のブランチを決める
        id: base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # master があれば master（リリース確定用）。まだ無い（未リリースの）リポジトリでは develop を土台にする
          # branches/master は、master が無いと既定のブランチの情報を返すことがあるので、一覧から名前で調べる
          if gh api --paginate "repos/$GH_REPO/branches" --jq '.[].name' | grep -qx master; then base=master; else base=develop; fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          # 土台にスクリプトが無い（develop にだけ入れた直後）ときは、次のリリースまで何もしない
          if gh api "repos/$GH_REPO/contents/scripts/apply-patch-updates.mjs?ref=$base" >/dev/null 2>&1; then ready=true; else ready=false; fi
          echo "ready=$ready" >>"$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "$base に scripts/apply-patch-updates.mjs がまだ無いので、何もしません（次のリリースで $base へ入ってから動きます）。" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open="$(gh pr list --state open --base "$base" --json headRefName --jq '[.[] | select(.headRefName | startswith("chore/patch-updates-"))] | length')"
          echo "open=$open" >>"$GITHUB_OUTPUT"
          if [ "$open" != 0 ]; then
            echo "前回の patch 更新の PR が開いたままです（$open 件）。新しい PR は作りません。" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: 土台のブランチを取得する
        if: steps.base.outputs.ready == 'true' && steps.base.outputs.open == '0'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.base }}
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: .NET SDK を用意する
        if: steps.base.outputs.ready == 'true' && steps.base.outputs.open == '0'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Node.js を用意する
        if: steps.base.outputs.ready == 'true' && steps.base.outputs.open == '0'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: patch 更新を検出して適用する
        if: steps.base.outputs.ready == 'true' && steps.base.outputs.open == '0'
        id: apply
        run: node scripts/apply-patch-updates.mjs

      - name: ブランチを作って PR を出し、自動マージを設定する
        if: steps.base.outputs.open == '0' && steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.apply.outputs.count }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          branch="chore/patch-updates-$(date -u +%Y%m%d)"
          git config user.name 'my-repo-automation-bot[bot]'
          git config user.email 'noreply@github.com'
          git checkout -b "$branch"
          mv patch-updates-summary.md "$RUNNER_TEMP/summary.md"
          git add -A
          git commit -m "npm と NuGet の patch 更新（${COUNT} 件）を自動で適用する

          同じ major.minor の最新の安定版へ上げた。NOTICE の版とロックファイルも追随させた（scripts/apply-patch-updates.mjs）。
          検証: PR の CI（必須チェック）が通ったら自動でマージする。"
          git push origin "$branch"
          url="$(gh pr create --base "$BASE" --head "$branch" \
            --title "npm と NuGet の patch 更新（${COUNT} 件）を自動で適用する" \
            --body-file "$RUNNER_TEMP/summary.md")"
          echo "PR: $url" >>"$GITHUB_STEP_SUMMARY"
          # 必須チェックが全部通ったら、GitHub が自動でマージする（リポジトリで自動マージを許可してある）
          gh pr merge "$url" --auto --squash

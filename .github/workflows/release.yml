# タグ・master・版整合性検査と dry-run の運用は Questionnaire から採用した。
#
# タグ vX.Y.Z で、GitHub Releases（配布 ZIP）と nuget.org（dotnet tool）へ公開する。手順は _documents/リリース手順.md。
#
# nuget.org への認証は Trusted Publishing（GitHub Actions の OIDC）。**長期の API キーは持たない。**
# NuGet/login が OIDC トークンを nuget.org へ渡して、1 時間有効の API キーを受け取る（publish-nuget ジョブ）。
# 前提（管理者の作業。_documents/リリース手順.md「nuget.org の準備」）:
#   - nuget.org の Trusted Publishing に、このリポジトリ・このワークフロー（release.yml）のポリシーがあること
#   - 変数 NUGET_ORG_USER（組織の変数。このリポジトリへ共有）に、公開用の共用アカウントの nuget.org プロフィール名
#     （メールアドレスではない）が入っていること
#
# **公開した版は取り消せない（nuget.org では削除できず、非推奨にできるだけ）。** タグも付け直せない。
# 公開は verify（dry-run と同じ検査）を通ってから行い、dry-run と PR では pack の検証だけで push しない。
#
# 参照した一次情報（2026-10-29 参照）
#   - Trusted Publishing: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
#   - NuGet/login v1.2.0: https://github.com/NuGet/login
name: Release
on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    branches: [develop, master]
    paths: ['.github/workflows/release*.yml', 'scripts/package.ps1', 'scripts/release-check.ps1', 'Directory.Build.props', 'src/**/*.csproj', 'package*.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '公開せず配布物の作成と検証だけを行う'
        type: boolean
        default: true
      release_tag:
        description: '対象タグ（vX.Y.Z）。dry-run は省略可'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_tag || github.ref }}
      - name: タグと版と公開対象を確認する
        id: check
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: ./scripts/release-check.ps1 -Tag $env:RELEASE_TAG -DryRun:($env:DRY_RUN -eq 'true')
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
      - run: npm audit --audit-level=moderate
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build --no-restore -c Release
      - name: NuGet の脆弱性を検査する
        shell: pwsh
        run: ./scripts/nuget-vulnerable-check.ps1
      - name: 配布 ZIP と SHA-256 を作る
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: リリース配布物
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
      - name: dotnet tool の NuGet パッケージを作る（push はしない）
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.version }}
        run: dotnet pack src/VehicleVision.PleasanterTools.DatabaseConverter.Cli/VehicleVision.PleasanterTools.DatabaseConverter.Cli.csproj --no-restore -c Release -p:Version="$RELEASE_VERSION" -o nuget-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: NuGet パッケージ
          path: nuget-artifacts/*.nupkg
          if-no-files-found: error
  publish:
    name: release
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: リリース配布物
          path: release-assets
      - name: ZIP の整合性を確認する
        working-directory: release-assets
        run: sha256sum --check ./*.zip.sha256
      - name: リリースを公開する
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" --match 'v[0-9]*' 2>/dev/null || true)
          {
            echo '## 変更内容'
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$RELEASE_TAG"
            else
              git log --no-merges --format='- %s' "$RELEASE_TAG"
            fi
            echo
            echo '## 導入'
            echo
            echo "VehicleVision.PleasanterTools.DatabaseConverter-${RELEASE_TAG#v}-portable.zip を展開してください。.NET 10 ランタイムが必要です。手順は ZIP 内の _documents/ にあります。"
            echo
            echo 'AGPL-3.0-or-later。ソースは同じタグから取得できます。依存のライセンスは NOTICE を参照してください。'
          } > release-notes.md
          args=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          gh release create "${args[@]}" release-assets/*.zip release-assets/*.zip.sha256 LICENSE NOTICE
  publish-nuget:
    name: publish-nuget
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # nuget.org へ渡す OIDC トークンを発行するために要る
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: NuGet パッケージ
          path: nuget-artifacts
      - name: パッケージの版がタグと一致するか
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(nuget-artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::公開する nupkg は 1 つのはずです（${#packages[@]} 個）"
            exit 1
          fi
          expected="nuget-artifacts/VehicleVision.PleasanterTools.DatabaseConverter.${RELEASE_VERSION}.nupkg"
          if [ "${packages[0]}" != "$expected" ]; then
            echo "::error::パッケージ(${packages[0]})がタグの版($expected)と合わない"
            exit 1
          fi
      - name: NuGet のユーザー名が設定されているか
        env:
          NUGET_ORG_USER: ${{ vars.NUGET_ORG_USER }}
        run: |
          if [ -z "$NUGET_ORG_USER" ]; then
            echo "::error title=変数 NUGET_ORG_USER が未設定です::組織の変数 NUGET_ORG_USER（このリポジトリへ共有）に、公開用の共用アカウントの nuget.org プロフィール名（メールアドレスではない）を登録すること（_documents/リリース手順.md）"
            exit 1
          fi
      - name: nuget.org の API キーを受け取る（OIDC。1 時間有効）
        id: login
        # 公開の認証を扱うので、コミットで固定する
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_ORG_USER }}
      - name: nuget.org へ公開する
        # --skip-duplicate: 同じ版の再実行を害のないものにする
        run: >
          dotnet nuget push "nuget-artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
